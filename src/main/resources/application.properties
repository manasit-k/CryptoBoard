spring.application.name=CryptoBoard

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.com.demo.crypto.CryptoBoard=INFO
logging.level.org.springframework.web.reactive=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# WebFlux Configuration
spring.webflux.base-path=/

# Crypto Configuration — เพิ่ม/ลดเหรียญได้ที่นี่โดยไม่ต้องแก้โค้ด (OCP)
crypto.symbols=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,ADAUSDT,XRPUSDT,DOGEUSDT,DOTUSDT

# ประวัติราคา — เปิด/ปิดการบันทึกลง DB ได้
crypto.history.enabled=true
# ช่วงเวลาบันทึกราคาลง DB (มิลลิวินาที)
crypto.persistence.interval-ms=5000

# JDBC — H2 file เก็บข้อมูลไว้ในโฟลเดอร์ data/
spring.datasource.url=jdbc:h2:file:./data/cryptoboard;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
